name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import glob, os, zipfile
          for zf in glob.glob('*.zip'):
              print('unzip', zf)
              with zipfile.ZipFile(zf) as z:
                  for info in z.infolist():
                      name = info.filename.replace('\\', '/')
                      if name.endswith('/'):
                          os.makedirs(name, exist_ok=True)
                          continue
                      d = os.path.dirname(name)
                      if d:
                          os.makedirs(d, exist_ok=True)
                      with z.open(info) as src, open(name, 'wb') as out:
                          out.write(src.read())
          PY
          test -d patch
      - uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: v4.0.2
          path: spd-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: env
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "no build-tools dir"
      - name: build
        run: |
          SRC=spd-src
          cp -rf patch/core/src/main/java/* "$SRC/core/src/main/java/"
          mkdir -p "$SRC/core/src/main/assets"
          cp -rf patch/core/src/main/assets/* "$SRC/core/src/main/assets/"
          cd "$SRC"
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew android:assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "gradle exit=$code"
          if [ $code -ne 0 ]; then
            echo "=========== What went wrong ==========="
            grep -A 30 "What went wrong" build.log | head -60
            echo "=========== javac errors ==========="
            grep -E "error:|error;|错误" build.log | head -60
            echo "=========== last 40 lines ==========="
            tail -40 build.log
          fi
          exit $code
      - run: |
          APK=$(find spd-src/android/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK"
          cp "$APK" abyss-expansion-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-expansion-apk
          path: abyss-expansion-android.apk
