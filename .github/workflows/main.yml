name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do unzip -q -o "$z"; done
          for d in */; do [ -d "$d/patch" ] && cp -rf "$d/patch" . ; done
          test -d patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          curl -L -o spd.zip https://github.com/00-Evan/shattered-pixel-dungeon/archive/refs/tags/v4.0.2.zip
          unzip -q spd.zip
          SRC=$(ls -d shattered-pixel-dungeon-* | head -1)
          cp -rf patch/core/src/main/java/* "$SRC/core/src/main/java/"
          mkdir -p "$SRC/core/src/main/assets"
          cp -rf patch/core/src/main/assets/* "$SRC/core/src/main/assets/"
          cd "$SRC"
          chmod +x gradlew
          ./gradlew android:assembleDebug --no-daemon --stacktrace
      - run: |
          SRC=$(ls -d shattered-pixel-dungeon-* | head -1)
          APK=$(find "$SRC/android/build/outputs/apk" -name "*.apk" | head -1)
          cp "$APK" abyss-expansion-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-expansion-apk
          path: abyss-expansion-android.apk
